name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      POLAR_ORGANIZATION_TOKEN: ${{ secrets.POLAR_ORGANIZATION_TOKEN }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      POLAR_SERVER: production
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: node scripts/validate-deployment-env.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Configure Convex production environment
        run: |
          pnpm --filter @repo/backend exec convex env set SITE_URL "$SITE_URL"
          pnpm --filter @repo/backend exec convex env set BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          pnpm --filter @repo/backend exec convex env set GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          pnpm --filter @repo/backend exec convex env set GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          pnpm --filter @repo/backend exec convex env set POLAR_ORGANIZATION_TOKEN "$POLAR_ORGANIZATION_TOKEN"
          pnpm --filter @repo/backend exec convex env set POLAR_WEBHOOK_SECRET "$POLAR_WEBHOOK_SECRET"
          pnpm --filter @repo/backend exec convex env set POLAR_SERVER "$POLAR_SERVER"

      - run: pnpm deploy:backend
      - run: pnpm deploy:user-application
